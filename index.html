<body>

<div class="container">

  <div class="header">
    <h1>EVENT CHECK-IN</h1>
    <p>Scan your QR code to check in</p>
  </div>


  <!-- QR SCANNER -->

  <div class="card">

    <div class="section-title">
      QR CHECK-IN
    </div>

    <div id="reader"></div>

    <div id="cameraStatus" class="camera-status">
      Starting camera...
    </div>

  </div>


  <!-- MANUAL SEARCH -->

  <div class="card">

    <div class="section-title">
      Manual Search
    </div>

    <div class="divider">
      Search by Name / IC / Unique ID
    </div>

    <div class="search-row">

      <input
        id="searchInput"
        type="text"
        placeholder="Enter Name / IC / Unique ID"
        autocomplete="off"
      >

      <button
        id="searchButton"
        class="search-btn"
        onclick="performSearch()"
      >
        SEARCH
      </button>

    </div>


    <div id="loading" class="loading">
      Checking participant...
    </div>


    <div id="results" class="results"></div>

  </div>

</div>


<!-- RESULT OVERLAY -->

<div id="resultOverlay" class="overlay">

  <div class="overlay-box">

    <div id="statusIcon" class="status-icon">
      ✓
    </div>

    <div id="overlayTitle" class="overlay-title">
      CHECK-IN SUCCESSFUL
    </div>

    <div id="overlayName" class="overlay-name">
      -
    </div>

    <div id="overlayInfo" class="overlay-info">
      -
    </div>

    <div id="overlayMessage" class="overlay-message">
      -
    </div>

  </div>

</div>


<script>

/*******************************************************
 * CONFIGURATION
 *******************************************************/

const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycbxmfs8QmyTqEEOID7IRM4n5TfpuJAHRsx2SvBam4qR57y51DvlbUop2qkjf7dHWuuyI/exec";


/*******************************************************
 * GLOBALS
 *******************************************************/

let html5QrCode = null;

let scannerRunning = false;

let currentJsonpScript = null;


/*******************************************************
 * INITIALIZE
 *******************************************************/

window.addEventListener("load", function() {

  startScanner();

});


/*******************************************************
 * CAMERA
 *******************************************************/

function startScanner() {

  const status =
    document.getElementById("cameraStatus");

  html5QrCode =
    new Html5Qrcode("reader");


  html5QrCode
    .start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: function(viewfinderWidth, viewfinderHeight) {

          const minDimension =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            );

          const size =
            Math.floor(
              minDimension * 0.70
            );

          return {
            width: size,
            height: size
          };

        }

      },

      function(decodedText) {

        if (!scannerRunning) {
          return;
        }

        scannerRunning = false;

        stopScanner();

        sendCheckIn(decodedText);

      },

      function(errorMessage) {

        // Normal scanner noise.
        // Do nothing.

      }

    )

    .then(function() {

      scannerRunning = true;

      status.textContent =
        "Camera ready — scan participant QR code";

    })

    .catch(function(error) {

      console.error(
        "Camera error:",
        error
      );

      status.textContent =
        "Camera could not start. Please allow camera permission.";

    });

}


/*******************************************************
 * STOP CAMERA
 *******************************************************/

function stopScanner() {

  if (
    html5QrCode &&
    scannerRunning
  ) {

    html5QrCode
      .stop()
      .then(function() {

        scannerRunning = false;

      })
      .catch(function(error) {

        console.log(
          "Scanner stop error:",
          error
        );

        scannerRunning = false;

      });

  }

}


/*******************************************************
 * RESTART CAMERA
 *******************************************************/

function restartScanner() {

  const status =
    document.getElementById("cameraStatus");

  status.textContent =
    "Starting camera...";


  if (html5QrCode) {

    html5QrCode
      .clear()
      .catch(function() {});

  }


  html5QrCode =
    new Html5Qrcode("reader");


  html5QrCode
    .start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: function(viewfinderWidth, viewfinderHeight) {

          const minDimension =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            );

          const size =
            Math.floor(
              minDimension * 0.70
            );

          return {
            width: size,
            height: size
          };

        }

      },

      function(decodedText) {

        if (!scannerRunning) {
          return;
        }

        scannerRunning = false;

        stopScanner();

        sendCheckIn(decodedText);

      },

      function(errorMessage) {}

    )

    .then(function() {

      scannerRunning = true;

      status.textContent =
        "Camera ready — scan participant QR code";

    })

    .catch(function(error) {

      console.error(
        "Camera restart error:",
        error
      );

      status.textContent =
        "Camera could not start.";

    });

}


/*******************************************************
 * JSONP REQUEST
 *******************************************************/

function callBackend(params, callback) {

  const callbackName =
    "backendCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  window[callbackName] =
    function(data) {

      console.log(
        "Backend response:",
        data
      );


      try {

        callback(data);

      }

      finally {

        cleanup();

      }

    };


  const script =
    document.createElement("script");


  currentJsonpScript =
    script;


  const query =
    new URLSearchParams(params);


  query.set(
    "callback",
    callbackName
  );


  query.set(
    "t",
    Date.now()
  );


  const url =
    BACKEND_URL +
    "?" +
    query.toString();


  console.log(
    "Backend URL:",
    url
  );


  script.src = url;

  script.async = true;


  script.onerror =
    function() {

      console.error(
        "Backend request failed."
      );


      callback({

        success: false,

        status: "ERROR",

        message:
          "Unable to connect to check-in server."

      });


      cleanup();

    };


  document.body.appendChild(script);


  function cleanup() {

    try {

      delete window[callbackName];

    }

    catch (error) {

      window[callbackName] =
        undefined;

    }


    if (script.parentNode) {

      script.parentNode.removeChild(
        script
      );

    }


    if (
      currentJsonpScript === script
    ) {

      currentJsonpScript =
        null;

    }

  }

}


/*******************************************************
 * QR CHECK-IN
 *******************************************************/

function sendCheckIn(uniqueId) {

  uniqueId =
    String(uniqueId || "")
      .trim();


  if (!uniqueId) {

    showResult({

      success: false,

      status: "ERROR",

      message:
        "Invalid QR code."

    });

    return;

  }


  showLoading();


  callBackend(

    {
      action: "checkin",
      id: uniqueId
    },

    function(data) {

      hideLoading();

      handleBackendResult(data);

    }

  );

}


/*******************************************************
 * MANUAL SEARCH
 *******************************************************/

function performSearch() {

  const input =
    document.getElementById(
      "searchInput"
    );


  const query =
    input.value.trim();


  if (!query) {

    input.focus();

    return;

  }


  console.log(
    "Searching:",
    query
  );


  showLoading();


  document.getElementById(
    "results"
  ).innerHTML = "";


  callBackend(

    {
      action: "search",
      q: query
    },

    function(data) {

      hideLoading();


      if (
        !data ||
        data.status !==
          "SEARCH_RESULTS"
      ) {

        displaySearchResults([]);

        return;

      }


      displaySearchResults(
        data.results || []
      );

    }

  );

}


/*******************************************************
 * ENTER KEY
 *******************************************************/

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        performSearch();

      }

    }
  );


/*******************************************************
 * DISPLAY SEARCH RESULTS
 *******************************************************/

function displaySearchResults(results) {

  const container =
    document.getElementById(
      "results"
    );


  container.innerHTML = "";


  if (
    !results ||
    results.length === 0
  ) {

    container.innerHTML =
      '<div class="no-results">' +
      'No participant found.' +
      '</div>';

    return;

  }


  results.forEach(function(person) {

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "result-card";


    const name =
      document.createElement(
        "div"
      );

    name.className =
      "result-name";

    name.textContent =
      person.name || "-";


    const info =
      document.createElement(
        "div"
      );

    info.className =
      "result-info";


    let html = "";

    html +=
      "IC: " +
      escapeHtml(
        maskIC(person.ic || "")
      ) +
      "<br>";

    html +=
      "Unique ID: " +
      escapeHtml(
        person.uniqueId || ""
      );


    if (
      person.checkedIn
    ) {

      html +=
        "<br>Checked in: " +
        escapeHtml(
          person.checkInTime || ""
        );

    }


    info.innerHTML =
      html;


    card.appendChild(
      name
    );

    card.appendChild(
      info
    );


    const button =
      document.createElement(
        "button"
      );


    if (
      person.checkedIn
    ) {

      button.className =
        "already-btn";

      button.textContent =
        "ALREADY CHECKED IN";

      button.disabled = true;

    }

    else {

      button.className =
        "checkin-btn";

      button.textContent =
        "CHECK IN";

      button.onclick =
        function() {

          manualCheckIn(
            person.uniqueId
          );

        };

    }


    card.appendChild(
      button
    );


    container.appendChild(
      card
    );

  });

}


/*******************************************************
 * MANUAL CHECK-IN
 *******************************************************/

function manualCheckIn(uniqueId) {

  showLoading();


  callBackend(

    {
      action: "checkin",
      id: uniqueId
    },

    function(data) {

      hideLoading();

      handleBackendResult(data);

    }

  );

}


/*******************************************************
 * HANDLE BACKEND RESULT
 *******************************************************/

function handleBackendResult(data) {

  console.log(
    "Handling result:",
    data
  );


  if (!data) {

    showResult({

      success: false,

      status: "ERROR",

      message:
        "No response received."

    });

    return;

  }


  if (
    data.status ===
    "CHECKED_IN"
  ) {

    showResult({

      success: true,

      status: "CHECKED_IN",

      name:
        data.name,

      ic:
        data.ic,

      uniqueId:
        data.uniqueId,

      checkInTime:
        data.checkInTime,

      message:
        data.message

    });


    return;

  }


  if (
    data.status ===
    "ALREADY_CHECKED_IN"
  ) {

    showResult({

      success: false,

      status:
        "ALREADY_CHECKED_IN",

      name:
        data.name,

      ic:
        data.ic,

      uniqueId:
        data.uniqueId,

      checkInTime:
        data.checkInTime,

      message:
        data.message

    });


    return;

  }


  if (
    data.status ===
    "NOT_FOUND"
  ) {

    showResult({

      success: false,

      status:
        "NOT_FOUND",

      message:
        "Participant not found."

    });


    return;

  }


  showResult({

    success: false,

    status:
      "ERROR",

    message:
      data.message ||
      "Something went wrong."

  });

}


/*******************************************************
 * RESULT OVERLAY
 *******************************************************/

function showResult(data) {

  const overlay =
    document.getElementById(
      "resultOverlay"
    );


  const icon =
    document.getElementById(
      "statusIcon"
    );


  const title =
    document.getElementById(
      "overlayTitle"
    );


  const name =
    document.getElementById(
      "overlayName"
    );


  const info =
    document.getElementById(
      "overlayInfo"
    );


  const message =
    document.getElementById(
      "overlayMessage"
    );


  if (
    data.status ===
    "CHECKED_IN"
  ) {

    icon.textContent =
      "✓";

    title.textContent =
      "CHECK-IN SUCCESSFUL";

    name.textContent =
      data.name || "-";


    info.innerHTML =
      "IC: " +
      escapeHtml(
        maskIC(
          data.ic || ""
        )
      ) +
      "<br>" +
      "Unique ID: " +
      escapeHtml(
        data.uniqueId || ""
      ) +
      "<br>" +
      "Time: " +
      escapeHtml(
        data.checkInTime || ""
      );


    message.textContent =
      "Thank you. You are successfully checked in.";

  }


  else if (
    data.status ===
    "ALREADY_CHECKED_IN"
  ) {

    icon.textContent =
      "✓";

    title.textContent =
      "ALREADY CHECKED IN";

    name.textContent =
      data.name || "-";


    info.innerHTML =
      "IC: " +
      escapeHtml(
        maskIC(
          data.ic || ""
        )
      ) +
      "<br>" +
      "Unique ID: " +
      escapeHtml(
        data.uniqueId || ""
      ) +
      "<br>" +
      "Original check-in: " +
      escapeHtml(
        data.checkInTime || ""
      );


    message.textContent =
      "This participant has already checked in.";

  }


  else {

    icon.textContent =
      "⚠";

    title.textContent =
      "CHECK-IN ERROR";

    name.textContent =
      "";


    info.textContent =
      "";


    message.textContent =
      data.message ||
      "Unable to complete check-in.";

  }


  overlay.style.display =
    "flex";


  setTimeout(function() {

    overlay.style.display =
      "none";


    document.getElementById(
      "results"
    ).innerHTML = "";


    document.getElementById(
      "searchInput"
    ).value = "";


    restartScanner();

  }, 2200);

}


/*******************************************************
 * LOADING
 *******************************************************/

function showLoading() {

  document.getElementById(
    "loading"
  ).style.display =
    "block";


  document.getElementById(
    "searchButton"
  ).disabled =
    true;

}


function hideLoading() {

  document.getElementById(
    "loading"
  ).style.display =
    "none";


  document.getElementById(
    "searchButton"
  ).disabled =
    false;

}


/*******************************************************
 * MASK IC
 *******************************************************/

function maskIC(ic) {

  if (!ic) {
    return "";
  }


  const value =
    String(ic);


  if (
    value.length <= 4
  ) {

    return value;

  }


  return (
    "*".repeat(
      value.length - 4
    ) +
    value.slice(-4)
  );

}


/*******************************************************
 * ESCAPE HTML
 *******************************************************/

function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
