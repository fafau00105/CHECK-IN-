<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Event Check-In</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      background: #f4f6f8;
      color: #17212b;
    }

    body {
      min-height: 100vh;
    }

    /* =========================
       MAIN CONTAINER
       ========================= */

    .app {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    /* =========================
       HEADER
       ========================= */

    .header {
      padding: 8px 4px 22px;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: #17212b;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
      color: #687582;
      font-weight: 400;
    }

    /* =========================
       CARD
       ========================= */

    .card {
      background: #ffffff;
      border: 1px solid #e3e8ed;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow:
        0 2px 8px rgba(20, 35, 50, 0.035);
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #6a7682;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    /* =========================
       SCANNER
       ========================= */

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #111820;
    }

    #reader video {
      width: 100% !important;
      border-radius: 12px;
    }

    #reader__scan_region {
      border-radius: 12px;
      overflow: hidden;
    }

    #reader__dashboard {
      display: none !important;
    }

    .camera-status {
      text-align: center;
      font-size: 12px;
      color: #7a8691;
      padding: 10px 0 2px;
    }

    /* =========================
       SEARCH
       ========================= */

    .divider {
      font-size: 13px;
      color: #78848f;
      margin-bottom: 10px;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-row input {
      flex: 1;
      min-width: 0;
      height: 46px;
      border: 1px solid #d9e0e6;
      border-radius: 10px;
      padding: 0 13px;
      font-size: 14px;
      outline: none;
      background: #fafbfc;
      color: #17212b;
      transition: border-color 0.15s ease,
                  box-shadow 0.15s ease;
    }

    .search-row input:focus {
      border-color: #3f78b5;
      box-shadow: 0 0 0 3px rgba(63, 120, 181, 0.10);
      background: #ffffff;
    }

    .search-btn {
      height: 46px;
      padding: 0 18px;
      border: none;
      border-radius: 10px;
      background: #285f92;
      color: white;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition:
        background 0.15s ease,
        transform 0.1s ease;
    }

    .search-btn:hover {
      background: #214f7b;
    }

    .search-btn:active {
      transform: scale(0.98);
    }

    .search-btn:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 18px 0 4px;
      font-size: 13px;
      color: #6f7b86;
    }

    /* =========================
       SEARCH RESULTS
       ========================= */

    .results {
      margin-top: 14px;
    }

    .result-card {
      border: 1px solid #e0e6eb;
      border-radius: 13px;
      padding: 15px;
      margin-bottom: 10px;
      background: #fbfcfd;
    }

    .result-name {
      font-size: 17px;
      line-height: 1.25;
      font-weight: 750;
      color: #17212b;
      margin-bottom: 5px;
    }

    .result-id {
      font-size: 14px;
      font-weight: 750;
      color: #285f92;
      letter-spacing: 0.3px;
      margin-bottom: 11px;
    }

    .result-meta {
      font-size: 12px;
      color: #687582;
      line-height: 1.6;
    }

    .result-action {
      width: 100%;
      height: 42px;
      margin-top: 12px;
      border: none;
      border-radius: 9px;
      background: #285f92;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
    }

    .result-action.already {
      background: #f0f2f4;
      color: #6b747d;
      cursor: default;
    }

    .no-results {
      text-align: center;
      padding: 18px 8px 5px;
      font-size: 13px;
      color: #7b8791;
    }

    /* =========================
       FULL SCREEN OVERLAYS
       ========================= */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(19, 29, 38, 0.62);
      backdrop-filter: blur(4px);
    }

    .overlay-box {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 20px;
      padding: 30px 24px 24px;
      text-align: center;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.20);
    }

    /* =========================
       STATUS MARK
       ========================= */

    .status-mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 400;
      line-height: 1;
    }

    .status-mark.success {
      background: #e8f6ed;
      color: #23924d;
    }

    .status-mark.already {
      background: #fdecec;
      color: #d33b3b;
    }

    .status-mark.error {
      background: #fdecec;
      color: #d33b3b;
    }

    .status-mark.processing {
      width: 52px;
      height: 52px;
      border: 4px solid #e5e9ed;
      border-top-color: #285f92;
      background: transparent;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       RESULT OVERLAY
       ========================= */

    .overlay-title {
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 1px;
      color: #687582;
      margin-bottom: 18px;
    }

    .overlay-name {
      font-size: 25px;
      line-height: 1.18;
      font-weight: 800;
      color: #17212b;
      word-break: break-word;
      margin-bottom: 7px;
    }

    .overlay-id {
      font-size: 17px;
      line-height: 1.3;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #285f92;
      margin-bottom: 22px;
    }

    .overlay-info {
      border-top: 1px solid #edf0f2;
      padding-top: 15px;
      margin-top: 2px;
      font-size: 13px;
      line-height: 1.8;
      color: #687582;
    }

    .overlay-info strong {
      color: #3c4852;
      font-weight: 650;
    }

    .overlay-message {
      margin-top: 13px;
      font-size: 13px;
      line-height: 1.5;
      color: #687582;
    }

    /* =========================
       NEXT SCAN BUTTON
       ========================= */

    .next-scan-btn {
      width: 100%;
      height: 50px;
      margin-top: 24px;
      border: none;
      border-radius: 11px;
      background: #285f92;
      color: #ffffff;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 0.4px;
      cursor: pointer;
      transition:
        background 0.15s ease,
        transform 0.1s ease;
    }

    .next-scan-btn:hover {
      background: #214f7b;
    }

    .next-scan-btn:active {
      transform: scale(0.985);
    }

    /* =========================
       PROCESSING
       ========================= */

    .processing-title {
      font-size: 15px;
      font-weight: 750;
      color: #17212b;
      margin-bottom: 6px;
    }

    .processing-message {
      font-size: 13px;
      line-height: 1.5;
      color: #74808a;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 480px) {

      .app {
        padding:
          14px
          12px
          30px;
      }

      .header {
        padding:
          6px
          3px
          17px;
      }

      .header h1 {
        font-size: 23px;
      }

      .card {
        padding: 15px;
        border-radius: 14px;
      }

      .overlay {
        padding: 14px;
      }

      .overlay-box {
        padding:
          27px
          19px
          20px;
        border-radius: 18px;
      }

      .overlay-name {
        font-size: 23px;
      }

      .overlay-id {
        font-size: 16px;
      }

      .status-mark {
        width: 60px;
        height: 60px;
      }
    }

  </style>
</head>

<body>

<div class="app">

  <!-- =========================
       HEADER
       ========================= -->

  <div class="header">
    <h1>EVENT CHECK-IN</h1>
    <p>Scan your QR code to check in</p>
  </div>


  <!-- =========================
       QR SCANNER
       ========================= -->

  <div class="card">

    <div class="section-title">
      QR CHECK-IN
    </div>

    <div id="reader"></div>

    <div
      id="cameraStatus"
      class="camera-status">
      Starting camera...
    </div>

  </div>


  <!-- =========================
       MANUAL SEARCH
       ========================= -->

  <div class="card">

    <div class="section-title">
      MANUAL SEARCH
    </div>

    <div class="divider">
      Search by Name / IC / Unique ID
    </div>

    <div class="search-row">

      <input
        id="searchInput"
        type="text"
        placeholder="Enter Name / IC / Unique ID"
        autocomplete="off"
      >

      <button
        id="searchButton"
        class="search-btn"
        onclick="performSearch()">
        SEARCH
      </button>

    </div>

    <div
      id="loading"
      class="loading">
      Checking participant...
    </div>

    <div
      id="results"
      class="results">
    </div>

  </div>

</div>


<!-- =========================
     PROCESSING OVERLAY
     ========================= -->

<div
  id="processingOverlay"
  class="overlay">

  <div class="overlay-box">

    <div
      class="status-mark processing">
    </div>

    <div class="processing-title">
      CHECKING PARTICIPANT
    </div>

    <div class="processing-message">
      QR code detected.<br>
      Please wait...
    </div>

  </div>

</div>


<!-- =========================
     RESULT OVERLAY
     ========================= -->

<div
  id="resultOverlay"
  class="overlay">

  <div class="overlay-box">

    <div
      id="statusMark"
      class="status-mark">
      ✓
    </div>

    <div
      id="overlayTitle"
      class="overlay-title">
      CHECK-IN SUCCESSFUL
    </div>

    <div
      id="overlayName"
      class="overlay-name">
      -
    </div>

    <div
      id="overlayId"
      class="overlay-id">
      -
    </div>

    <div
      id="overlayInfo"
      class="overlay-info">
      -
    </div>

    <div
      id="overlayMessage"
      class="overlay-message">
      -
    </div>

    <button
      id="nextScanButton"
      class="next-scan-btn"
      onclick="nextScan()">
      NEXT SCAN
    </button>

  </div>

</div>


<script>

  /* =========================================================
     CONFIGURATION
     ========================================================= */

  const BACKEND_URL =
    "https://script.google.com/macros/s/AKfycbxmfs8QmyTqEEOID7IRM4n5TfpuJAHRsx2SvBam4qR57y51DvlbUop2qkjf7dHWuuyI/exec";


  /* =========================================================
     GLOBALS
     ========================================================= */

  let html5QrCode = null;
  let scannerRunning = false;
  let currentJsonpScript = null;


  /* =========================================================
     PAGE LOAD
     ========================================================= */

  window.addEventListener("load", function() {

    startScanner();

    document
      .getElementById("searchInput")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          performSearch();
        }

      });

  });


  /* =========================================================
     START SCANNER
     ========================================================= */

  async function startScanner() {

    const cameraStatus =
      document.getElementById("cameraStatus");

    cameraStatus.textContent =
      "Starting camera...";

    scannerRunning = false;

    try {

      html5QrCode =
        new Html5Qrcode("reader");

      await html5QrCode.start(
        {
          facingMode: "environment"
        },
        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          },
          aspectRatio: 1.0
        },

        async function(decodedText) {

          if (!scannerRunning) {
            return;
          }

          scannerRunning = false;

          /*
           * IMPORTANT:
           * Fully stop scanner before processing.
           */

          await stopScanner();

          sendCheckIn(decodedText);

        },

        function(errorMessage) {
          // Ignore continuous scanner errors.
        }
      );

      scannerRunning = true;

      cameraStatus.textContent =
        "Camera ready — scan participant QR code";

    }

    catch (error) {

      console.error(
        "Camera error:",
        error
      );

      cameraStatus.textContent =
        "Unable to start camera. Please allow camera access.";

    }

  }


  /* =========================================================
     STOP SCANNER
     ========================================================= */

  async function stopScanner() {

    if (!html5QrCode) {
      scannerRunning = false;
      return;
    }

    try {

      if (scannerRunning) {
        await html5QrCode.stop();
      }

    }

    catch (error) {

      console.log(
        "Scanner stop:",
        error
      );

    }

    scannerRunning = false;

  }


  /* =========================================================
     NEXT SCAN
     ========================================================= */

  async function nextScan() {

    /*
     * Hide result first.
     */

    document
      .getElementById("resultOverlay")
      .style.display = "none";


    /*
     * Clear previous search.
     */

    document
      .getElementById("results")
      .innerHTML = "";

    document
      .getElementById("searchInput")
      .value = "";


    /*
     * Make sure old scanner is completely stopped.
     */

    scannerRunning = false;

    try {

      if (html5QrCode) {

        try {
          await html5QrCode.stop();
        }
        catch (e) {}

        try {
          await html5QrCode.clear();
        }
        catch (e) {}

      }

    }

    catch (error) {

      console.log(
        "Scanner cleanup:",
        error
      );

    }


    /*
     * Small delay prevents camera lifecycle conflict.
     */

    await new Promise(function(resolve) {
      setTimeout(resolve, 250);
    });


    /*
     * Start a completely fresh scanner.
     */

    await startScanner();

  }


  /* =========================================================
     SEND CHECK-IN
     ========================================================= */

  function sendCheckIn(uniqueId) {

    uniqueId =
      String(uniqueId || "").trim();

    if (!uniqueId) {

      showResult({
        success: false,
        status: "ERROR",
        message: "Invalid QR code."
      });

      return;
    }


    /*
     * Immediate feedback.
     */

    showProcessing();


    callBackend(
      {
        action: "checkin",
        id: uniqueId
      },

      function(data) {

        handleBackendResult(data);

      }
    );

  }


  /* =========================================================
     BACKEND JSONP
     ========================================================= */

  function callBackend(params, callback) {

    const callbackName =
      "backendCallback_" +
      Date.now() +
      "_" +
      Math.floor(
        Math.random() * 100000
      );


    window[callbackName] =
      function(data) {

        cleanupJsonp();

        callback(data);

      };


    const query =
      new URLSearchParams();


    Object.keys(params).forEach(function(key) {

      query.append(
        key,
        params[key]
      );

    });


    query.append(
      "callback",
      callbackName
    );


    query.append(
      "t",
      Date.now()
    );


    const script =
      document.createElement("script");


    currentJsonpScript =
      script;


    script.src =
      BACKEND_URL +
      "?" +
      query.toString();


    script.onerror =
      function() {

        cleanupJsonp();

        callback({
          success: false,
          status: "ERROR",
          message:
            "Unable to connect to check-in server."
        });

      };


    document
      .body
      .appendChild(script);

  }


  /* =========================================================
     CLEANUP JSONP
     ========================================================= */

  function cleanupJsonp() {

    if (currentJsonpScript) {

      currentJsonpScript.remove();

      currentJsonpScript =
        null;

    }

    Object.keys(window)
      .filter(function(key) {

        return key.startsWith(
          "backendCallback_"
        );

      })
      .forEach(function(key) {

        delete window[key];

      });

  }


  /* =========================================================
     HANDLE BACKEND RESULT
     ========================================================= */

  function handleBackendResult(data) {

    hideProcessing();


    if (!data) {

      showResult({
        success: false,
        status: "ERROR",
        message:
          "No response received from server."
      });

      return;

    }


    if (
      data.status ===
      "CHECKED_IN"
    ) {

      showResult(data);

      return;

    }


    if (
      data.status ===
      "ALREADY_CHECKED_IN"
    ) {

      showResult(data);

      return;

    }


    if (
      data.status ===
      "NOT_FOUND"
    ) {

      showResult({
        success: false,
        status: "NOT_FOUND",
        message:
          "Participant was not found."
      });

      return;

    }


    showResult({
      success: false,
      status: "ERROR",
      message:
        data.message ||
        "Unable to process check-in."
    });

  }


  /* =========================================================
     PROCESSING OVERLAY
     ========================================================= */

  function showProcessing() {

    document
      .getElementById("processingOverlay")
      .style.display = "flex";

  }


  function hideProcessing() {

    document
      .getElementById("processingOverlay")
      .style.display = "none";

  }


  /* =========================================================
     RESULT DISPLAY
     ========================================================= */

  function showResult(data) {

    hideProcessing();


    const overlay =
      document.getElementById(
        "resultOverlay"
      );

    const statusMark =
      document.getElementById(
        "statusMark"
      );

    const title =
      document.getElementById(
        "overlayTitle"
      );

    const name =
      document.getElementById(
        "overlayName"
      );

    const id =
      document.getElementById(
        "overlayId"
      );

    const info =
      document.getElementById(
        "overlayInfo"
      );

    const message =
      document.getElementById(
        "overlayMessage"
      );


    /*
     * Reset classes.
     */

    statusMark.className =
      "status-mark";


    /*
     * SUCCESS
     */

    if (
      data.status ===
      "CHECKED_IN"
    ) {

      statusMark.classList.add(
        "success"
      );

      statusMark.textContent =
        "✓";

      title.textContent =
        "CHECK-IN SUCCESSFUL";

      name.textContent =
        data.name || "-";

      id.textContent =
        data.uniqueId || "-";

      info.innerHTML =
        "<strong>IC</strong> " +
        escapeHtml(
          maskIC(data.ic || "-")
        ) +
        "<br>" +
        "<strong>CHECK-IN TIME</strong> " +
        escapeHtml(
          data.checkInTime || "-"
        );

      message.textContent =
        "Participant successfully checked in.";

    }


    /*
     * ALREADY CHECKED IN
     */

    else if (
      data.status ===
      "ALREADY_CHECKED_IN"
    ) {

      statusMark.classList.add(
        "already"
      );

      statusMark.textContent =
        "✓";

      title.textContent =
        "ALREADY CHECKED IN";

      name.textContent =
        data.name || "-";

      id.textContent =
        data.uniqueId || "-";

      info.innerHTML =
        "<strong>IC</strong> " +
        escapeHtml(
          maskIC(data.ic || "-")
        ) +
        "<br>" +
        "<strong>ORIGINAL CHECK-IN</strong> " +
        escapeHtml(
          data.checkInTime || "-"
        );

      message.textContent =
        "This participant has already checked in.";

    }


    /*
     * NOT FOUND / ERROR
     */

    else {

      statusMark.classList.add(
        "error"
      );

      statusMark.textContent =
        "×";

      title.textContent =
        data.status ===
        "NOT_FOUND"
          ? "PARTICIPANT NOT FOUND"
          : "CHECK-IN FAILED";

      name.textContent =
        "";

      id.textContent =
        "";

      info.innerHTML =
        "";

      message.textContent =
        data.message ||
        "Unable to complete check-in.";

    }


    /*
     * Display result.
     */

    overlay.style.display =
      "flex";

  }


  /* =========================================================
     MANUAL SEARCH
     ========================================================= */

  function performSearch() {

    const input =
      document.getElementById(
        "searchInput"
      );

    const query =
      input.value.trim();


    if (!query) {
      return;
    }


    showLoading();

    document
      .getElementById("results")
      .innerHTML = "";


    callBackend(
      {
        action: "search",
        q: query
      },

      function(data) {

        hideLoading();

        displaySearchResults(data);

      }
    );

  }


  /* =========================================================
     DISPLAY SEARCH RESULTS
     ========================================================= */

  function displaySearchResults(data) {

    const container =
      document.getElementById(
        "results"
      );


    container.innerHTML = "";


    if (
      !data ||
      !data.results ||
      data.results.length === 0
    ) {

      container.innerHTML =
        '<div class="no-results">' +
        'No participant found.' +
        '</div>';

      return;

    }


    data.results.forEach(function(item) {

      const card =
        document.createElement("div");

      card.className =
        "result-card";


      const name =
        escapeHtml(
          item.name || "-"
        );

      const uniqueId =
        escapeHtml(
          item.uniqueId || "-"
        );

      const ic =
        escapeHtml(
          maskIC(item.ic || "-")
        );


      let html =

        '<div class="result-name">' +
          name +
        '</div>' +

        '<div class="result-id">' +
          uniqueId +
        '</div>' +

        '<div class="result-meta">' +
          'IC: ' +
          ic;


      if (item.checkInTime) {

        html +=
          '<br>Checked in: ' +
          escapeHtml(
            item.checkInTime
          );

      }


      html +=
        '</div>';


      if (item.checkedIn) {

        html +=

          '<button ' +
          'class="result-action already" ' +
          'disabled>' +
          'ALREADY CHECKED IN' +
          '</button>';

      }

      else {

        html +=

          '<button ' +
          'class="result-action" ' +
          'onclick="manualCheckIn(\'' +
          escapeAttribute(
            item.uniqueId
          ) +
          '\')">' +
          'CHECK IN' +
          '</button>';

      }


      card.innerHTML =
        html;


      container.appendChild(
        card
      );

    });

  }


  /* =========================================================
     MANUAL CHECK-IN
     ========================================================= */

  function manualCheckIn(uniqueId) {

    showProcessing();


    callBackend(
      {
        action: "checkin",
        id: uniqueId
      },

      function(data) {

        handleBackendResult(data);

      }
    );

  }


  /* =========================================================
     SEARCH LOADING
     ========================================================= */

  function showLoading() {

    document
      .getElementById("loading")
      .style.display = "block";

    document
      .getElementById("searchButton")
      .disabled = true;

  }


  function hideLoading() {

    document
      .getElementById("loading")
      .style.display = "none";

    document
      .getElementById("searchButton")
      .disabled = false;

  }


  /* =========================================================
     MASK IC
     ========================================================= */

  function maskIC(ic) {

    ic =
      String(ic || "");


    if (
      ic.length <= 4
    ) {

      return ic;

    }


    return "*".repeat(
      ic.length - 4
    ) +
    ic.slice(-4);

  }


  /* =========================================================
     ESCAPE HTML
     ========================================================= */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================================================
     ESCAPE ATTRIBUTE
     ========================================================= */

  function escapeAttribute(value) {

    return String(value)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");

  }

</script>

</body>
</html>
