<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Event Check-In</title>

<script src="https://unpkg.com/html5-qrcode"></script>


<style>

/* =====================================================
   GLOBAL
===================================================== */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #f4f7fb;

  color: #1f2937;
}


.container {

  width: 100%;

  max-width: 520px;

  margin: 0 auto;

  padding:
    20px
    16px
    40px;
}


/* =====================================================
   HEADER
===================================================== */

.header {

  text-align: center;

  margin-bottom: 20px;
}


.header h1 {

  margin: 0;

  font-size: 28px;

  font-weight: 700;

  color: #123b68;
}


.header p {

  margin:
    8px
    0
    0;

  color: #64748b;

  font-size: 15px;
}


/* =====================================================
   CARD
===================================================== */

.card {

  background: white;

  border-radius: 16px;

  padding: 18px;

  margin-bottom: 16px;

  box-shadow:
    0 4px 18px
    rgba(0,0,0,0.07);
}


.section-title {

  font-size: 18px;

  font-weight: 700;

  margin-bottom: 12px;

  color: #123b68;
}


/* =====================================================
   QR READER
===================================================== */

#reader {

  width: 100%;

  overflow: hidden;

  border-radius: 12px;
}


#reader video {

  width: 100% !important;

  height: auto !important;

  border-radius: 12px;
}


.camera-status {

  text-align: center;

  margin-top: 10px;

  font-size: 14px;

  color: #64748b;
}


/* =====================================================
   SEARCH
===================================================== */

.search-row {

  display: flex;

  gap: 8px;
}


.search-row input {

  flex: 1;

  min-width: 0;
}


input {

  width: 100%;

  padding:
    13px
    14px;

  border:
    1px solid
    #cbd5e1;

  border-radius: 10px;

  font-size: 16px;

  outline: none;
}


input:focus {

  border-color: #2563eb;
}


button {

  border: none;

  border-radius: 10px;

  padding:
    13px
    18px;

  font-size: 15px;

  font-weight: 700;

  cursor: pointer;
}


.search-btn {

  background: #123b68;

  color: white;
}


.search-btn:disabled {

  opacity: 0.6;

  cursor: not-allowed;
}


/* =====================================================
   SEARCH RESULTS
===================================================== */

.results {

  margin-top: 15px;
}


.result-card {

  border:
    1px solid
    #dbe3ec;

  border-radius: 12px;

  padding: 14px;

  margin-bottom: 10px;

  background: #fff;
}


.result-name {

  font-size: 17px;

  font-weight: 700;

  margin-bottom: 6px;
}


.result-info {

  font-size: 14px;

  color: #64748b;

  line-height: 1.5;
}


.checkin-btn {

  width: 100%;

  margin-top: 12px;

  background: #198754;

  color: white;
}


.already-btn {

  width: 100%;

  margin-top: 12px;

  background: #94a3b8;

  color: white;

  cursor: default;
}


.no-results {

  text-align: center;

  color: #64748b;

  padding:
    15px
    5px;
}


/* =====================================================
   LOADING
===================================================== */

.loading {

  display: none;

  text-align: center;

  padding: 14px;

  color: #475569;

  font-size: 14px;
}


.divider {

  text-align: center;

  margin:
    8px
    0
    18px;

  color: #94a3b8;

  font-size: 13px;
}


/* =====================================================
   OVERLAYS
===================================================== */

.overlay {

  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,0.65);

  display: none;

  align-items: center;

  justify-content: center;

  padding: 20px;

  z-index: 9999;
}


.overlay-box {

  width: 100%;

  max-width: 430px;

  background: white;

  border-radius: 20px;

  padding:
    28px
    22px;

  text-align: center;

  box-shadow:
    0 10px 40px
    rgba(0,0,0,0.25);
}


.status-icon {

  font-size: 58px;

  margin-bottom: 10px;
}


.overlay-title {

  font-size: 27px;

  font-weight: 800;

  margin-bottom: 12px;
}


.overlay-name {

  font-size: 21px;

  font-weight: 700;

  margin-bottom: 8px;
}


.overlay-info {

  color: #64748b;

  font-size: 15px;

  line-height: 1.6;
}


.overlay-message {

  margin-top: 14px;

  font-size: 14px;

  color: #475569;

  line-height: 1.5;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 480px) {

  .container {

    padding:
      16px
      12px
      30px;
  }


  .header h1 {

    font-size: 25px;
  }


  .card {

    padding: 15px;
  }


  .search-row {

    flex-direction: column;
  }


  .search-btn {

    width: 100%;
  }

}

</style>

</head>


<body>


<div class="container">


  <!-- =================================================
       HEADER
  ================================================== -->

  <div class="header">

    <h1>
      EVENT CHECK-IN
    </h1>

    <p>
      Scan your QR code to check in
    </p>

  </div>


  <!-- =================================================
       QR CHECK-IN
  ================================================== -->

  <div class="card">

    <div class="section-title">
      QR CHECK-IN
    </div>


    <div id="reader"></div>


    <div
      id="cameraStatus"
      class="camera-status"
    >
      Starting camera...
    </div>

  </div>


  <!-- =================================================
       MANUAL SEARCH
  ================================================== -->

  <div class="card">

    <div class="section-title">
      Manual Search
    </div>


    <div class="divider">
      Search by Name / IC / Unique ID
    </div>


    <div class="search-row">

      <input
        id="searchInput"
        type="text"
        placeholder="Enter Name / IC / Unique ID"
        autocomplete="off"
      >


      <button
        id="searchButton"
        class="search-btn"
        onclick="performSearch()"
      >
        SEARCH
      </button>

    </div>


    <div
      id="loading"
      class="loading"
    >
      Checking participant...
    </div>


    <div
      id="results"
      class="results"
    ></div>

  </div>

</div>


<!-- ===================================================
     PROCESSING OVERLAY
==================================================== -->

<div
  id="processingOverlay"
  class="overlay"
>

  <div class="overlay-box">

    <div class="status-icon">
      🔄
    </div>


    <div class="overlay-title">
      CHECKING PARTICIPANT
    </div>


    <div class="overlay-message">

      QR code detected.<br>

      Please wait...

    </div>

  </div>

</div>


<!-- ===================================================
     RESULT OVERLAY
==================================================== -->

<div
  id="resultOverlay"
  class="overlay"
>

  <div class="overlay-box">

    <div
      id="statusIcon"
      class="status-icon"
    >
      ✓
    </div>


    <div
      id="overlayTitle"
      class="overlay-title"
    >
      CHECK-IN SUCCESSFUL
    </div>


    <div
      id="overlayName"
      class="overlay-name"
    >
      -
    </div>


    <div
      id="overlayInfo"
      class="overlay-info"
    >
      -
    </div>


    <div
      id="overlayMessage"
      class="overlay-message"
    >
      -
    </div>

  </div>

</div>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycbxmfs8QmyTqEEOID7IRM4n5TfpuJAHRsx2SvBam4qR57y51DvlbUop2qkjf7dHWuuyI/exec";


/* =====================================================
   GLOBALS
===================================================== */

let html5QrCode = null;

let scannerRunning = false;

let currentJsonpScript = null;


/* =====================================================
   PAGE INITIALIZATION
===================================================== */

window.addEventListener(
  "load",
  function() {

    startScanner();

  }
);


/* =====================================================
   START SCANNER
===================================================== */

function startScanner() {

  const status =
    document.getElementById(
      "cameraStatus"
    );


  html5QrCode =
    new Html5Qrcode(
      "reader"
    );


  html5QrCode
    .start(

      {
        facingMode:
          "environment"
      },

      {

        fps: 10,

        qrbox:
          function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            const minDimension =
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              );


            const size =
              Math.floor(
                minDimension * 0.70
              );


            return {

              width: size,

              height: size

            };

          }

      },


      function(decodedText) {

        if (!scannerRunning) {
          return;
        }


        /*
         * Immediately lock scanner
         * so the same QR cannot
         * trigger multiple times.
         */

        scannerRunning = false;


        /*
         * Actually stop camera.
         */

        stopScanner();


        /*
         * Send participant ID.
         */

        sendCheckIn(
          decodedText
        );

      },


      function(errorMessage) {

        /*
         * Normal QR scanner noise.
         * Ignore.
         */

      }

    )


    .then(
      function() {

        scannerRunning = true;

        status.textContent =
          "Camera ready — scan participant QR code";

      }
    )


    .catch(
      function(error) {

        console.error(
          "Camera error:",
          error
        );


        status.textContent =
          "Camera could not start. Please allow camera permission.";

      }
    );

}


/* =====================================================
   STOP SCANNER
===================================================== */

async function stopScanner() {

  if (!html5QrCode) {

    scannerRunning =
      false;

    return;

  }


  try {

    await html5QrCode.stop();

  }

  catch (error) {

    console.log(
      "Scanner stop:",
      error
    );

  }


  scannerRunning =
    false;

}


/* =====================================================
   RESTART SCANNER
===================================================== */

async function restartScanner() {

  const status =
    document.getElementById(
      "cameraStatus"
    );


  status.textContent =
    "Starting camera...";


  scannerRunning =
    false;


  /*
   * Make absolutely sure
   * the previous scanner
   * is stopped.
   */

  if (html5QrCode) {

    try {

      await html5QrCode.stop();

    }

    catch (error) {

      console.log(
        "Previous scanner already stopped."
      );

    }


    try {

      html5QrCode.clear();

    }

    catch (error) {}

  }


  /*
   * Give the camera a short
   * moment to fully release.
   */

  await new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        300
      );

    }
  );


  /*
   * Create a fresh scanner.
   */

  html5QrCode =
    new Html5Qrcode(
      "reader"
    );


  html5QrCode
    .start(

      {
        facingMode:
          "environment"
      },

      {

        fps: 10,

        qrbox:
          function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            const minDimension =
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              );


            const size =
              Math.floor(
                minDimension * 0.70
              );


            return {

              width: size,

              height: size

            };

          }

      },


      function(decodedText) {

        if (!scannerRunning) {
          return;
        }


        /*
         * Lock scanner immediately.
         */

        scannerRunning =
          false;


        /*
         * Stop camera.
         */

        stopScanner();


        /*
         * Process participant.
         */

        sendCheckIn(
          decodedText
        );

      },


      function(errorMessage) {

        /*
         * Normal scanner noise.
         */

      }

    )


    .then(
      function() {

        scannerRunning =
          true;


        status.textContent =
          "Camera ready — scan participant QR code";

      }
    )


    .catch(
      function(error) {

        console.error(
          "Camera restart error:",
          error
        );


        status.textContent =
          "Camera could not start. Please allow camera permission.";

      }
    );

}


/* =====================================================
   JSONP BACKEND REQUEST
===================================================== */

function callBackend(
  params,
  callback
) {

  const callbackName =
    "backendCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  /*
   * Create global callback.
   */

  window[callbackName] =
    function(data) {

      console.log(
        "Backend response:",
        data
      );


      try {

        callback(data);

      }

      finally {

        cleanup();

      }

    };


  /*
   * Create script request.
   */

  const script =
    document.createElement(
      "script"
    );


  currentJsonpScript =
    script;


  const query =
    new URLSearchParams(
      params
    );


  query.set(
    "callback",
    callbackName
  );


  query.set(
    "t",
    Date.now()
  );


  const url =
    BACKEND_URL +
    "?" +
    query.toString();


  console.log(
    "Backend URL:",
    url
  );


  script.src =
    url;


  script.async =
    true;


  /*
   * Handle connection failure.
   */

  script.onerror =
    function() {

      console.error(
        "Backend request failed."
      );


      callback({

        success: false,

        status: "ERROR",

        message:
          "Unable to connect to check-in server."

      });


      cleanup();

    };


  document.body.appendChild(
    script
  );


  /*
   * Cleanup JSONP script.
   */

  function cleanup() {

    try {

      delete window[
        callbackName
      ];

    }

    catch (error) {

      window[
        callbackName
      ] = undefined;

    }


    if (script.parentNode) {

      script.parentNode.removeChild(
        script
      );

    }


    if (
      currentJsonpScript ===
      script
    ) {

      currentJsonpScript =
        null;

    }

  }

}


/* =====================================================
   QR CHECK-IN
===================================================== */

function sendCheckIn(
  uniqueId
) {

  uniqueId =
    String(
      uniqueId || ""
    ).trim();


  if (!uniqueId) {

    showResult({

      success: false,

      status: "ERROR",

      message:
        "Invalid QR code."

    });


    return;

  }


  /*
   * Immediate user feedback.
   */

  showProcessing();


  /*
   * Contact Apps Script.
   */

  callBackend(

    {

      action:
        "checkin",

      id:
        uniqueId

    },


    function(data) {

      handleBackendResult(
        data
      );

    }

  );

}


/* =====================================================
   MANUAL SEARCH
===================================================== */

function performSearch() {

  const input =
    document.getElementById(
      "searchInput"
    );


  const query =
    input.value.trim();


  if (!query) {

    input.focus();

    return;

  }


  console.log(
    "Searching:",
    query
  );


  showLoading();


  document.getElementById(
    "results"
  ).innerHTML = "";


  callBackend(

    {

      action:
        "search",

      q:
        query

    },


    function(data) {

      hideLoading();


      if (
        !data ||
        data.status !==
          "SEARCH_RESULTS"
      ) {

        displaySearchResults(
          []
        );

        return;

      }


      displaySearchResults(
        data.results || []
      );

    }

  );

}


/* =====================================================
   ENTER KEY SEARCH
===================================================== */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        performSearch();

      }

    }
  );


/* =====================================================
   DISPLAY SEARCH RESULTS
===================================================== */

function displaySearchResults(
  results
) {

  const container =
    document.getElementById(
      "results"
    );


  container.innerHTML =
    "";


  if (
    !results ||
    results.length === 0
  ) {

    container.innerHTML =
      '<div class="no-results">' +
      'No participant found.' +
      '</div>';


    return;

  }


  results.forEach(
    function(person) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "result-card";


      /*
       * NAME
       */

      const name =
        document.createElement(
          "div"
        );


      name.className =
        "result-name";


      name.textContent =
        person.name || "-";


      /*
       * DETAILS
       */

      const info =
        document.createElement(
          "div"
        );


      info.className =
        "result-info";


      let html = "";


      html +=
        "IC: " +
        escapeHtml(
          maskIC(
            person.ic || ""
          )
        ) +
        "<br>";


      html +=
        "Unique ID: " +
        escapeHtml(
          person.uniqueId || ""
        );


      if (
        person.checkedIn
      ) {

        html +=
          "<br>Checked in: " +
          escapeHtml(
            person.checkInTime || ""
          );

      }


      info.innerHTML =
        html;


      card.appendChild(
        name
      );


      card.appendChild(
        info
      );


      /*
       * CHECK-IN BUTTON
       */

      const button =
        document.createElement(
          "button"
        );


      if (
        person.checkedIn
      ) {

        button.className =
          "already-btn";


        button.textContent =
          "ALREADY CHECKED IN";


        button.disabled =
          true;

      }

      else {

        button.className =
          "checkin-btn";


        button.textContent =
          "CHECK IN";


        button.onclick =
          function() {

            manualCheckIn(
              person.uniqueId
            );

          };

      }


      card.appendChild(
        button
      );


      container.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   MANUAL CHECK-IN
===================================================== */

function manualCheckIn(
  uniqueId
) {

  showProcessing();


  callBackend(

    {

      action:
        "checkin",

      id:
        uniqueId

    },


    function(data) {

      handleBackendResult(
        data
      );

    }

  );

}


/* =====================================================
   HANDLE BACKEND RESULT
===================================================== */

function handleBackendResult(
  data
) {

  console.log(
    "Handling result:",
    data
  );


  /*
   * Remove processing overlay.
   */

  document.getElementById(
    "processingOverlay"
  ).style.display =
    "none";


  if (!data) {

    showResult({

      success: false,

      status: "ERROR",

      message:
        "No response received."

    });


    return;

  }


  /*
   * SUCCESS
   */

  if (
    data.status ===
    "CHECKED_IN"
  ) {

    showResult({

      success:
        true,

      status:
        "CHECKED_IN",

      name:
        data.name,

      ic:
        data.ic,

      uniqueId:
        data.uniqueId,

      checkInTime:
        data.checkInTime,

      message:
        data.message

    });


    return;

  }


  /*
   * ALREADY CHECKED IN
   */

  if (
    data.status ===
    "ALREADY_CHECKED_IN"
  ) {

    showResult({

      success:
        false,

      status:
        "ALREADY_CHECKED_IN",

      name:
        data.name,

      ic:
        data.ic,

      uniqueId:
        data.uniqueId,

      checkInTime:
        data.checkInTime,

      message:
        data.message

    });


    return;

  }


  /*
   * NOT FOUND
   */

  if (
    data.status ===
    "NOT_FOUND"
  ) {

    showResult({

      success:
        false,

      status:
        "NOT_FOUND",

      message:
        "Participant not found."

    });


    return;

  }


  /*
   * OTHER ERROR
   */

  showResult({

    success:
      false,

    status:
      "ERROR",

    message:
      data.message ||
      "Something went wrong."

  });

}


/* =====================================================
   PROCESSING OVERLAY
===================================================== */

function showProcessing() {

  const overlay =
    document.getElementById(
      "processingOverlay"
    );


  overlay.style.display =
    "flex";

}


/* =====================================================
   RESULT OVERLAY
===================================================== */

function showResult(
  data
) {

  /*
   * Hide processing overlay.
   */

  document.getElementById(
    "processingOverlay"
  ).style.display =
    "none";


  const overlay =
    document.getElementById(
      "resultOverlay"
    );


  const icon =
    document.getElementById(
      "statusIcon"
    );


  const title =
    document.getElementById(
      "overlayTitle"
    );


  const name =
    document.getElementById(
      "overlayName"
    );


  const info =
    document.getElementById(
      "overlayInfo"
    );


  const message =
    document.getElementById(
      "overlayMessage"
    );


  /*
   * SUCCESS
   */

  if (
    data.status ===
    "CHECKED_IN"
  ) {

    icon.textContent =
      "✓";


    title.textContent =
      "CHECK-IN SUCCESSFUL";


    name.textContent =
      data.name || "-";


    info.innerHTML =

      "IC: " +

      escapeHtml(
        maskIC(
          data.ic || ""
        )
      ) +

      "<br>" +

      "Unique ID: " +

      escapeHtml(
        data.uniqueId || ""
      ) +

      "<br>" +

      "Time: " +

      escapeHtml(
        data.checkInTime || ""
      );


    message.textContent =
      "Thank you. You are successfully checked in.";

  }


  /*
   * ALREADY CHECKED IN
   */

  else if (
    data.status ===
    "ALREADY_CHECKED_IN"
  ) {

    icon.textContent =
      "✓";


    title.textContent =
      "ALREADY CHECKED IN";


    name.textContent =
      data.name || "-";


    info.innerHTML =

      "IC: " +

      escapeHtml(
        maskIC(
          data.ic || ""
        )
      ) +

      "<br>" +

      "Unique ID: " +

      escapeHtml(
        data.uniqueId || ""
      ) +

      "<br>" +

      "Original check-in: " +

      escapeHtml(
        data.checkInTime || ""
      );


    message.textContent =
      "This participant has already checked in.";

  }


  /*
   * ERROR
   */

  else {

    icon.textContent =
      "⚠";


    title.textContent =
      "CHECK-IN ERROR";


    name.textContent =
      "";


    info.textContent =
      "";


    message.textContent =
      data.message ||
      "Unable to complete check-in.";

  }


  /*
   * Show result.
   */

  overlay.style.display =
    "flex";


  /*
   * Automatically return
   * to scanner.
   */

  setTimeout(
    async function() {

      overlay.style.display =
        "none";


      document.getElementById(
        "results"
      ).innerHTML =
        "";


      document.getElementById(
        "searchInput"
      ).value =
        "";


      /*
       * Restart camera.
       */

      await restartScanner();

    },
    2200
  );

}


/* =====================================================
   LOADING
===================================================== */

function showLoading() {

  document.getElementById(
    "loading"
  ).style.display =
    "block";


  document.getElementById(
    "searchButton"
  ).disabled =
    true;

}


function hideLoading() {

  document.getElementById(
    "loading"
  ).style.display =
    "none";


  document.getElementById(
    "searchButton"
  ).disabled =
    false;

}


/* =====================================================
   MASK IC
===================================================== */

function maskIC(
  ic
) {

  if (!ic) {

    return "";

  }


  const value =
    String(ic);


  if (
    value.length <= 4
  ) {

    return value;

  }


  return (

    "*".repeat(
      value.length - 4
    ) +

    value.slice(-4)

  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
