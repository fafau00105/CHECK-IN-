<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Event Check-In</title>

  <!-- QR SCANNER -->
  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .app {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      margin: auto;
      background: white;
    }

    /* =========================
       HEADER
       ========================= */

    .header {
      background: #0f4c81;
      color: white;
      padding: 20px 18px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
      font-weight: 700;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }


    /* =========================
       CONTENT
       ========================= */

    .content {
      padding: 18px;
    }


    /* =========================
       SCANNER
       ========================= */

    .scanner-card {
      background: white;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    #reader video {
      width: 100% !important;
      border-radius: 12px;
    }

    #reader__dashboard_section_swaplink {
      display: none !important;
    }

    .scanner-status {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
      color: #64748b;
    }


    /* =========================
       SEARCH
       ========================= */

    .search-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
    }

    .search-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      height: 46px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 0 13px;
      font-size: 16px;
      outline: none;
    }

    .search-input:focus {
      border-color: #0f4c81;
    }

    .btn {
      height: 46px;
      padding: 0 18px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: #0f4c81;
      color: white;
    }

    .btn-success {
      background: #16a34a;
      color: white;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }


    /* =========================
       SEARCH RESULTS
       ========================= */

    .results {
      margin-top: 12px;
    }

    .result-card {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 8px;
      background: #f8fafc;
    }

    .result-name {
      font-weight: 700;
      font-size: 16px;
    }

    .result-info {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }

    .result-actions {
      margin-top: 10px;
    }


    /* =========================
       RESULT OVERLAY
       ========================= */

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
      background: rgba(15, 23, 42, 0.88);
    }

    .overlay.show {
      display: flex;
    }

    .result-box {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 24px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }

    .result-icon {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 48px;
      font-weight: bold;
    }

    .success-icon {
      background: #dcfce7;
      color: #16a34a;
    }

    .warning-icon {
      background: #fef3c7;
      color: #d97706;
    }

    .error-icon {
      background: #fee2e2;
      color: #dc2626;
    }

    .result-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .result-name-large {
      font-size: 23px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .result-details {
      font-size: 15px;
      color: #475569;
      line-height: 1.7;
    }

    .result-message {
      margin-top: 16px;
      font-size: 14px;
      color: #64748b;
    }

    .countdown {
      margin-top: 20px;
      font-size: 13px;
      color: #94a3b8;
    }


    /* =========================
       LOADING
       ========================= */

    .loading {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      background: rgba(255,255,255,0.92);
    }

    .loading.show {
      display: flex;
    }

    .loading-box {
      text-align: center;
    }

    .spinner {
      width: 48px;
      height: 48px;

      border: 5px solid #e2e8f0;
      border-top-color: #0f4c81;
      border-radius: 50%;

      animation: spin 0.8s linear infinite;
      margin: auto;
    }

    .loading-text {
      margin-top: 14px;
      font-size: 15px;
      font-weight: 600;
    }

    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 480px) {

      .header {
        padding: 17px 15px;
      }

      .header h1 {
        font-size: 22px;
      }

      .content {
        padding: 12px;
      }

      .result-title {
        font-size: 25px;
      }

      .result-name-large {
        font-size: 21px;
      }

    }

  </style>

</head>


<body>

<div class="app">


  <!-- =========================
       HEADER
       ========================= -->

  <div class="header">

    <h1>
      EVENT CHECK-IN
    </h1>

    <p>
      Scan your QR code to check in
    </p>

  </div>


  <div class="content">


    <!-- =========================
         SCANNER
         ========================= -->

    <div class="scanner-card">

      <div id="reader"></div>

      <div
        class="scanner-status"
        id="scannerStatus"
      >
        Starting camera...
      </div>

    </div>


    <!-- =========================
         MANUAL SEARCH
         ========================= -->

    <div class="search-section">

      <div class="search-title">
        Manual Search
      </div>


      <div class="search-row">

        <input
          id="searchInput"
          class="search-input"
          type="text"
          placeholder="Name / IC / Unique ID"
          autocomplete="off"
        >

        <button
          id="searchButton"
          class="btn btn-primary"
          onclick="performSearch()"
        >
          SEARCH
        </button>

      </div>


      <div
        id="searchResults"
        class="results">
      </div>

    </div>

  </div>

</div>


<!-- =========================
     RESULT OVERLAY
     ========================= -->

<div
  id="resultOverlay"
  class="overlay"
>

  <div class="result-box">

    <div
      id="resultIcon"
      class="result-icon"
    >
      ✓
    </div>

    <div
      id="resultTitle"
      class="result-title"
    >
      CHECK-IN SUCCESS
    </div>

    <div
      id="resultName"
      class="result-name-large"
    >
      -
    </div>

    <div
      id="resultDetails"
      class="result-details"
    >
      -
    </div>

    <div
      id="resultMessage"
      class="result-message"
    >
      -
    </div>

    <div
      id="countdown"
      class="countdown"
    >
      Returning to scanner...
    </div>

  </div>

</div>


<!-- =========================
     LOADING
     ========================= -->

<div
  id="loading"
  class="loading"
>

  <div class="loading-box">

    <div class="spinner"></div>

    <div class="loading-text">
      Checking participant...
    </div>

  </div>

</div>


<!-- =========================
     HIDDEN APPS SCRIPT IFRAME
     ========================= -->

<iframe
  id="backendFrame"
  name="backendFrame"
  style="display:none;"
  aria-hidden="true">
</iframe>


<script>


/*******************************************************
 * CONFIGURATION
 *******************************************************/

const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycbxmfs8QmyTqEEOID7IRM4n5TfpuJAHRsx2SvBam4qR57y51DvlbUop2qkjf7dHWuuyI/exec";


/*******************************************************
 * GLOBAL VARIABLES
 *******************************************************/

let html5QrCode = null;

let scannerRunning = false;

let processingScan = false;

let resetTimer = null;


/*******************************************************
 * START SCANNER
 *******************************************************/

async function startScanner() {

  const status =
    document.getElementById(
      "scannerStatus"
    );

  try {

    html5QrCode =
      new Html5Qrcode(
        "reader"
      );


    await html5QrCode.start(

      {
        facingMode: "environment"
      },

      {

        fps: 10,

        qrbox:
          function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            const size =
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * 0.70;

            return {

              width: size,

              height: size

            };

          },

        aspectRatio: 1.0

      },

      onQrSuccess,

      function(errorMessage) {

        // Normal scanning errors
        // are ignored.

      }

    );


    scannerRunning = true;

    status.textContent =
      "Point the camera at the QR code";


  }

  catch (error) {

    console.error(
      "Camera error:",
      error
    );

    status.innerHTML =
      "Camera could not start.<br>" +
      "Please allow camera access and reload this page.";

  }

}


/*******************************************************
 * QR SUCCESS
 *******************************************************/

async function onQrSuccess(
  decodedText
) {

  if (processingScan) {
    return;
  }

  processingScan = true;


  const uniqueId =
    extractUniqueId(
      decodedText
    );


  console.log(
    "QR scanned:",
    decodedText
  );

  console.log(
    "Unique ID:",
    uniqueId
  );


  await stopScanner();


  showLoading();


  sendCheckIn(
    uniqueId
  );

}


/*******************************************************
 * EXTRACT UNIQUE ID
 *******************************************************/

function extractUniqueId(
  text
) {

  text =
    String(text || "")
      .trim();


  /*
   * Normal QR:
   *
   * ABC001
   *
   * If QR contains:
   *
   * ABC001|NAME|IC
   *
   * we take the first part.
   */

  if (
    text.includes("|")
  ) {

    return text
      .split("|")[0]
      .trim();

  }


  return text;

}


/*******************************************************
 * STOP SCANNER
 *******************************************************/

async function stopScanner() {

  if (
    !html5QrCode ||
    !scannerRunning
  ) {

    return;

  }


  try {

    await html5QrCode.stop();

    html5QrCode.clear();

  }

  catch (error) {

    console.log(
      "Scanner stop:",
      error
    );

  }


  scannerRunning = false;

}


/*******************************************************
 * SEND CHECK-IN
 *******************************************************/

function sendCheckIn(
  uniqueId
) {

  const iframe =
    document.getElementById(
      "backendFrame"
    );


  const url =
    BACKEND_URL +
    "?action=checkin" +
    "&id=" +
    encodeURIComponent(
      uniqueId
    ) +
    "&t=" +
    Date.now();


  console.log(
    "Sending check-in:",
    url
  );


  iframe.src = url;

}


/*******************************************************
 * SEND SEARCH
 *******************************************************/

function performSearch() {

  const input =
    document.getElementById(
      "searchInput"
    );


  const query =
    input.value.trim();


  if (!query) {

    input.focus();

    return;

  }


  console.log(
    "Searching:",
    query
  );


  showLoading();


  const iframe =
    document.getElementById(
      "backendFrame"
    );


  const url =
    BACKEND_URL +
    "?action=search" +
    "&q=" +
    encodeURIComponent(
      query
    ) +
    "&t=" +
    Date.now();


  console.log(
    "Search URL:",
    url
  );


  iframe.src = url;

}


/*******************************************************
 * ONE UNIFIED BACKEND RESPONSE LISTENER
 *******************************************************/

window.addEventListener(
  "message",
  function(event) {


    const iframe =
      document.getElementById(
        "backendFrame"
      );


    /*
     * Make sure the message really
     * came from our hidden iframe.
     */

    if (
      !iframe ||
      event.source !==
      iframe.contentWindow
    ) {

      return;

    }


    /*
     * Make sure it is our backend
     * response.
     */

    if (
      !event.data ||
      event.data.type !==
      "CHECKIN_BACKEND_RESPONSE"
    ) {

      return;

    }


    const data =
      event.data.data;


    console.log(
      "Backend response:",
      data
    );


    /*
     * =========================
     * SEARCH RESPONSE
     * =========================
     */

    if (
      data &&
      data.status ===
      "SEARCH_RESULTS"
    ) {

      hideLoading();


      displaySearchResults(
        data.results || []
      );


      return;

    }


    /*
     * =========================
     * CHECK-IN RESPONSE
     * =========================
     */

    hideLoading();


    handleBackendResult(
      data
    );

  }
);


/*******************************************************
 * HANDLE CHECK-IN RESULT
 *******************************************************/

function handleBackendResult(
  data
) {


  if (!data) {

    showResult(

      "ERROR",

      "ERROR",

      "",

      "",

      "No response received from server."

    );

    return;

  }


  /*
   * SUCCESS
   */

  if (
    data.status ===
    "CHECKED_IN"
  ) {

    showResult(

      "SUCCESS",

      "CHECK-IN SUCCESS",

      data.name,

      "IC: " +
      maskIC(data.ic) +
      "<br>" +
      "Check-in time: " +
      data.checkInTime,

      "You have been successfully checked in."

    );

    return;

  }


  /*
   * ALREADY CHECKED IN
   */

  if (
    data.status ===
    "ALREADY_CHECKED_IN"
  ) {

    showResult(

      "WARNING",

      "ALREADY CHECKED IN",

      data.name,

      "IC: " +
      maskIC(data.ic) +
      "<br>" +
      "Original check-in: " +
      data.checkInTime,

      "This participant has already checked in."

    );

    return;

  }


  /*
   * ID NOT FOUND
   */

  if (
    data.status ===
    "NOT_FOUND"
  ) {

    showResult(

      "ERROR",

      "ID NOT FOUND",

      "",

      "",

      "The QR code does not match any participant."

    );

    return;

  }


  /*
   * OTHER ERROR
   */

  showResult(

    "ERROR",

    "ERROR",

    "",

    "",

    data.message ||
    "Something went wrong."

  );

}


/*******************************************************
 * SHOW RESULT
 *******************************************************/

function showResult(
  type,
  title,
  name,
  details,
  message
) {


  const overlay =
    document.getElementById(
      "resultOverlay"
    );


  const icon =
    document.getElementById(
      "resultIcon"
    );


  const titleElement =
    document.getElementById(
      "resultTitle"
    );


  const nameElement =
    document.getElementById(
      "resultName"
    );


  const detailsElement =
    document.getElementById(
      "resultDetails"
    );


  const messageElement =
    document.getElementById(
      "resultMessage"
    );


  const countdownElement =
    document.getElementById(
      "countdown"
    );


  icon.className =
    "result-icon";


  /*
   * SUCCESS
   */

  if (
    type === "SUCCESS"
  ) {

    icon.classList.add(
      "success-icon"
    );

    icon.textContent =
      "✓";

  }


  /*
   * WARNING
   */

  else if (
    type === "WARNING"
  ) {

    icon.classList.add(
      "warning-icon"
    );

    icon.textContent =
      "!";

  }


  /*
   * ERROR
   */

  else {

    icon.classList.add(
      "error-icon"
    );

    icon.textContent =
      "×";

  }


  titleElement.textContent =
    title;


  nameElement.textContent =
    name || "";


  detailsElement.innerHTML =
    details || "";


  messageElement.textContent =
    message || "";


  countdownElement.textContent =
    "Returning to scanner in 2 seconds...";


  overlay.classList.add(
    "show"
  );


  let seconds = 2;


  clearInterval(
    resetTimer
  );


  resetTimer =
    setInterval(
      function() {

        seconds--;


        if (
          seconds <= 0
        ) {

          clearInterval(
            resetTimer
          );


          hideResult();


          resetApp();

        }

        else {

          countdownElement.textContent =
            "Returning to scanner in " +
            seconds +
            " second" +
            (
              seconds === 1
                ? ""
                : "s"
            ) +
            "...";

        }

      },
      1000
    );

}


/*******************************************************
 * HIDE RESULT
 *******************************************************/

function hideResult() {

  document
    .getElementById(
      "resultOverlay"
    )
    .classList.remove(
      "show"
    );

}


/*******************************************************
 * RESET APP
 *******************************************************/

async function resetApp() {

  processingScan = false;


  document
    .getElementById(
      "searchResults"
    )
    .innerHTML = "";


  document
    .getElementById(
      "searchInput"
    )
    .value = "";


  document
    .getElementById(
      "scannerStatus"
    )
    .textContent =
    "Starting camera...";


  await startScanner();

}


/*******************************************************
 * SHOW LOADING
 *******************************************************/

function showLoading() {

  document
    .getElementById(
      "loading"
    )
    .classList.add(
      "show"
    );

}


/*******************************************************
 * HIDE LOADING
 *******************************************************/

function hideLoading() {

  document
    .getElementById(
      "loading"
    )
    .classList.remove(
      "show"
    );

}


/*******************************************************
 * MASK IC
 *******************************************************/

function maskIC(
  ic
) {

  if (!ic) {
    return "";
  }


  const value =
    String(ic);


  if (
    value.length >= 4
  ) {

    return (
      value.substring(
        0,
        value.length - 4
      ) +
      "****"
    );

  }


  return "****";

}


/*******************************************************
 * DISPLAY SEARCH RESULTS
 *******************************************************/

function displaySearchResults(
  results
) {


  const container =
    document.getElementById(
      "searchResults"
    );


  container.innerHTML = "";


  /*
   * NOTHING FOUND
   */

  if (
    !results.length
  ) {

    container.innerHTML = `

      <div class="result-card">

        No participant found.

      </div>

    `;

    return;

  }


  /*
   * SHOW RESULTS
   */

  results.forEach(
    function(person) {


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "result-card";


      const statusText =
        person.checkedIn

          ? "Already checked in: " +
            person.checkInTime

          : "Not checked in";


      let actionButton = "";


      if (
        !person.checkedIn
      ) {

        actionButton = `

          <button
            class="btn btn-success"
            onclick="manualCheckIn('${escapeJs(person.uniqueId)}')"
          >
            CHECK IN
          </button>

        `;

      }


      card.innerHTML = `

        <div class="result-name">
          ${escapeHtml(person.name)}
        </div>

        <div class="result-info">
          IC:
          ${escapeHtml(maskIC(person.ic))}
        </div>

        <div class="result-info">
          ID:
          ${escapeHtml(person.uniqueId)}
        </div>

        <div class="result-info">
          ${escapeHtml(statusText)}
        </div>

        <div class="result-actions">
          ${actionButton}
        </div>

      `;


      container.appendChild(
        card
      );

    }
  );

}


/*******************************************************
 * MANUAL CHECK-IN
 *******************************************************/

function manualCheckIn(
  uniqueId
) {


  console.log(
    "Manual check-in:",
    uniqueId
  );


  showLoading();


  const iframe =
    document.getElementById(
      "backendFrame"
    );


  const url =
    BACKEND_URL +
    "?action=checkin" +
    "&id=" +
    encodeURIComponent(
      uniqueId
    ) +
    "&t=" +
    Date.now();


  iframe.src = url;

}


/*******************************************************
 * ESCAPE HTML
 *******************************************************/

function escapeHtml(
  value
) {

  return String(
    value || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/*******************************************************
 * ESCAPE JAVASCRIPT STRING
 *******************************************************/

function escapeJs(
  value
) {

  return String(
    value || ""
  )

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    )

    .replace(
      /\r/g,
      "\\r"
    )

    .replace(
      /\n/g,
      "\\n"
    );

}


/*******************************************************
 * SEARCH ENTER KEY
 *******************************************************/

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        performSearch();

      }

    }
  );


/*******************************************************
 * START APP
 *******************************************************/

window.addEventListener(
  "load",
  function() {

    startScanner();

  }
);

</script>

</body>
</html>
